<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0c16" />

    <title>Aarav Sharma — Frontend Developer | React Portfolio</title>
    <meta
      name="description"
      content="Portfolio of Aarav Sharma — Frontend Developer building fast, accessible web apps with React, TypeScript and modern CSS."
    />
    <meta name="author" content="Aarav Sharma" />

    <!-- Open Graph (WhatsApp/Linkedin preview) -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Aarav Sharma — Frontend Developer" />
    <meta
      property="og:description"
      content="Portfolio of Aarav Sharma — Frontend Developer building fast, accessible web apps with React."
    />
    <meta property="og:image" content="/og-image.svg" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />

    <!--
      Ye chhota script React load hone se PEHLE theme set kar deta hai.
      Isse page flash (white screen) nahi hota. Industry standard practice.
    -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('theme');
          var theme = saved ? JSON.parse(saved) : 'dark';
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {
          /* localStorage blocked ho toh default dark reh jayega */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>

    <!--
      Ye site ek React SPA hai, isliye JavaScript band karte hi #root khaali
      rehta hai. Is message ko render karne ke liye JS zaroori hai.
    -->
    <noscript>
      <div class="noscript">
        <h1>JavaScript zaroori hai</h1>
        <p>
          Ye portfolio React se bana hai, isliye content browser me dikhane ke liye
          JavaScript on hona padta hai. Kripya apne browser me JavaScript enable kar ke
          page dobara reload karein.
        </p>
      </div>
    </noscript>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
