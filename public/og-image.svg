      <stop offset="0%" stop-color="#090b14" />
      <stop offset="100%" stop-color="#16123a" />
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
