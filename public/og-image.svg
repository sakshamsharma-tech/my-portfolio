  <text x="118" y="124" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="700" fill="#ffffff" text-anchor="middle">AS</text>

  <text x="176" y="106" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="600" fill="#c7cce0">Aarav Sharma</text>
  <text x="176" y="136" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#8f97b4">Frontend Developer</text>

